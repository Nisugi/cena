[package]
name = "cena"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
cena-agent.workspace = true
cena-behavior.workspace = true
# AMENDED for Milestone 1 Step 2 (author's call, 2026-09-18). The login
# produces a ByteSource and the session consumes one; the binary is the only
# thing that holds both. See crates/cena-arch-tests/tests/layering.rs, where
# this edge is recorded against the rule it bends.
cena-platform.workspace = true
cena-session.workspace = true
cena-ui.workspace = true
cena-web.workspace = true
cena-host.workspace = true
# The window (plan/47): what the binary opens unless --headless or --web.
cena-gui.workspace = true
# `;scripts import` reads a Lich player's lich.db3 (plan/46 step 3).
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
# A hunt profile's settings, read as the chain lays them, for the settings
# menu's hunt pages (`hunt_pages.rs`). Already built for cena-behavior.
toml.workspace = true
# Fingerprint the exact map shared by travel and the read-only minimap.
sha2 = "0.10"

# `signal` for Ctrl-C. Without it the only early exit was killing the process,
# which skips BOTH the `quit` (plan/16 5b) and the sink flush -- so the run that
# a person interrupts left the character link-dead and the log truncated.
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-util = "0.7"

# The credential ladder (plan/29 Q2): the OS keyring, keyed by account, and a
# password prompt that does not echo. VellumFE's choices, at VellumFE's
# versions and backends (reference/VellumFE/Cargo.toml). Here in the binary
# and not in cena-platform, because CI builds cena-platform for Android and
# keyring has no Android backend; the binary is desktop-only.
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service", "vendored"] }
rpassword = "7"

# A trigger's sound and OS notification (plan/45 Stage 3, §6d), played by the
# binary so a session nobody watches still sounds. Here and not in a core
# crate for keyring's reason: CI builds the core for Android and iOS, and the
# binary is desktop-only. MEASURED 2026-09-27 by resolving each in an empty
# crate and diffing against this Cargo.lock: rodio adds 65 crates across
# every target (on Linux it links the system ALSA library, so CI installs
# libasound2-dev, as VellumFE's CI does); notify-rust with zbus on tokio adds
# 47, where its default would bring a second executor, async-io.
# rodio is VellumFE's (reference/VellumFE/src/sound.rs, 0.19 there); the
# formats are the four VellumFE plays: wav, mp3, ogg, flac.
rodio = { version = "0.22", default-features = false, features = ["playback", "wav", "mp3", "vorbis", "flac"] }
notify-rust = { version = "4.18", default-features = false, features = ["z-with-tokio"] }

[dev-dependencies]
# `test-util` for `start_paused`: `interrupt.rs`'s tests race a phase that
# never ends against a Ctrl-C that fires after a second, in virtual time.
tokio = { version = "1", features = ["test-util"] }
futures-util = { version = "0.3", features = ["sink"] }
serde_json = "1"
tokio-tungstenite = "0.29"

[lints]
workspace = true
