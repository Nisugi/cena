[workspace]
resolver = "3"
members = [
    "crates/cena-platform",
    "crates/cena-protocol",
    "crates/cena-model",
    "crates/cena-map",
    "crates/cena-session",
    "crates/cena-behavior",
    "crates/cena-ui",
    "crates/cena-web",
    "crates/cena-host",
    "crates/cena",
    "crates/cena-arch-tests",
]
# The spike has its own lockfile and its own native-tls (spike/eaccess-spike/
# Cargo.toml:8-11); it is not a member. `rtest/` is untracked scratch left by a
# review probe. Neither is excluded because omission is fatal to
# `cargo test --workspace` -- it is not -- but because running cargo *inside*
# either directory otherwise errors with "current package believes it's in a
# workspace when it's not".
exclude = ["spike/eaccess-spike", "rtest"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
cena-platform = { path = "crates/cena-platform" }
cena-protocol = { path = "crates/cena-protocol" }
cena-model = { path = "crates/cena-model" }
cena-map = { path = "crates/cena-map" }
cena-session = { path = "crates/cena-session" }
cena-behavior = { path = "crates/cena-behavior" }
cena-ui = { path = "crates/cena-ui" }
cena-web = { path = "crates/cena-web" }
cena-host = { path = "crates/cena-host" }

# The first and only serialization in the workspace, added for M3 step 8.
# `research/04-inherited-decisions.md:1878` (C21) argues the character store is
# a serde SNAPSHOT rather than a storage model: Lich needs SQLite because Ruby
# has no cheap typed serialization, not because the access pattern wants a
# database. `derive` because the snapshot is ~10 structs of named fields, and
# hand-writing `Serialize` for them is the kind of work the macro exists for.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The combat recorder (`cena-session/src/combat_recorder.rs`). Author decision
# 2026-09-20, `inventory/11` §8: the recorder is relational -- seven tables, and
# every report is a join -- which is the access pattern the character store's
# serde snapshot does NOT have. `bundled` compiles SQLite in, so the binary
# carries its own and no target needs a system library.
rusqlite = { version = "0.40", features = ["bundled"] }

# Hunt profiles (`plan/30` section 5). TOML is the author's choice for what a
# player writes by hand (Q4, 2026-09-24): "Stores that Hydra writes stay
# JSON." Read and written through serde, so the profile is one typed struct
# and a mistyped key is refused by name rather than ignored. Pure Rust, so
# the Android and iOS core builds (`plan/12` section 1a) are unaffected.
toml = "1"

[workspace.lints.rust]
unsafe_code = "deny"

# **Rustdoc is the API reference; `plan/27` is the reading guide.** That split
# was decided after `27g` described the bounty module's messaging layer and
# omitted `classify()` and `TaskKind`'s 22 variants -- the centre of the port.
# A hand-written summary drifts from the code; generated docs cannot, but only
# for items that HAVE docs. This is what makes the reference complete enough to
# be the reference.
#
# `deny` since 2026-09-23, when the count reached zero. It started at `warn`
# as a ratchet: 528 items were undocumented, and turning it straight to `deny`
# would have forced placeholder comments written to silence a lint, which are
# worse than none -- they look like documentation and say nothing. They were
# written against the parser and the code that fills each field instead.
#
# A rustc lint, not a rustdoc one, so it fires on `cargo clippy` too and an
# undocumented item is visible without building docs.
missing_docs = "deny"

# A citation that resolves to nothing does not fail loudly; it manufactures a
# false negative. `CLAUDE.md` records the cost in full: an agent searched a dead
# path, got zero hits, and concluded the wiki does not document `styleIfClosed`.
# It documents it five times.
#
# Intra-doc links are the machine-checkable half of that problem, so the machine
# checks them. Review finding PL-11 found ~40 broken ones; `plan/05` Rule 0 says
# a rule that is not enforced is a wish.
#
# `private_intra_doc_links` is included deliberately. A link from public docs to
# a private item renders as plain text for anyone reading the built docs, so it
# is a citation that silently resolves to nothing for exactly the audience the
# docs are for.
[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
redundant_explicit_links = "deny"

[workspace.lints.clippy]
# Group at negative priority so specific lints can override it; without this
# Cargo errors on the ambiguity.
pedantic = { level = "warn", priority = -1 }
# plan/06 section 1.5: the parser never panicking is "Non-negotiable".
# plan/12 section 5.5: a panic kills one session, not the process.
#
# These are scoped away from test targets by clippy.toml's
# allow-{unwrap,expect,panic}-in-tests. Without that, `cargo clippy
# --all-targets -- -D warnings` (plan/06 section 4 item 2) goes red on the
# first ordinary unit test, and plan/12 section 7.2 requires unit, replay and
# interleave tests at M1. Per-file #![allow] attributes were rejected: a
# forgotten attribute breaks the build rather than degrading quietly.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"

# plan/12 section 5.5: panic = "abort" defeats per-session isolation.
# Asserted by no_profile_aborts_on_panic, because a manifest line is a wish.
[profile.release]
panic = "unwind"
