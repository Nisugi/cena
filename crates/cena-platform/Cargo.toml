[package]
name = "cena-platform"
version.workspace = true
edition.workspace = true
publish.workspace = true

# plan/12 section 5.5 commits to CancellationToken, "every wait has a
# deadline", bounded channels and one supervised task per session. That is
# tokio, not threads: a blocking `read` cannot be cancelled, and criterion 4's
# 250ms stop is unachievable if the task is parked in one. The spike
# (spike/eaccess-spike/src/main.rs:23-24) is blocking-sync std::net and its own
# header calls itself throwaway; it is rewritten here, not ported -- except for
# the three findings named in live.rs, which ARE ported verbatim.
#
# `time` carries tokio::time::pause(), which is what makes criterion 4's
# deadline a property of the code rather than of the test machine's scheduler.
[dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }


# native-tls, NOT rustls. eaccess.play.net negotiates TLS 1.2 with static-RSA
# key exchange (0x009c, AES128-GCM-SHA256), which rustls refuses to implement.
# VERIFIED by packet capture 2026-09-18; spike/eaccess-spike/Cargo.toml:8-11
# records the same finding. This is knowledge that lives in code (CLAUDE.md),
# so it is carried across rather than rediscovered.
native-tls = "0.2"
tokio-native-tls = "0.3"
# TCP keepalive, which tokio's TcpStream cannot set. Already in the lock file
# as tokio's own dependency, so this adds a dependency EDGE and no new code to
# the build. It is what makes a half-open socket detectable at all: see
# `live.rs`'s KEEPALIVE_* constants.
#
# `all` for `set_tcp_user_timeout` (Linux/Android), the send-side twin of
# keepalive -- see `live.rs`'s UNACKED_SEND_TIMEOUT. A feature of the crate
# already built, not a new dependency.
socket2 = { version = "0.6", features = ["all"] }
jiff = "0.2.37"
# The eaccess certificate pin (`src/eaccess/pin.rs`) is stored as PEM and
# compared as DER, so it must decode base64. Already in the lock file at this
# version as `reqwest`'s own dependency, so this adds an EDGE and no new code.
# Hand-rolled PEM framing around it, as VellumFE does (`network.rs`
# `pem_to_der`): native-tls's `Certificate::from_pem` is a stub on iOS.
base64 = "0.22"

# The HTTPS web-login fallback (plan/10 section 5.3). Chosen for the WORKSPACE,
# not just for this module: the author named three consumers -- this fallback, a
# web frontend, and push notifications to remote endpoints.
#
# `default-features = false` is LOAD-BEARING. reqwest's default is
# `default-tls = [rustls]`, so leaving it on links BOTH stacks. With it off and
# `native-tls` on, `cargo tree` shows zero rustls implementation crates and the
# same `native-tls` + `tokio-native-tls` this crate already depends on for
# eaccess. (`rustls-pki-types` still appears: a shared certificate TYPE crate
# with no TLS code, which every client pulls.) VERIFIED 2026-09-19.
#
# WHY NOT ureq, which VellumFE uses (`reference/VellumFE/Cargo.toml:82-83`,
# "Rides the same native-tls stack as eAccess login; no rustls, no second TLS
# stack"). Vellum's reasoning is right and is followed here -- one TLS stack --
# but ureq itself does not transfer, because it is BLOCKING and Vellum's every
# use of it sits on a dedicated worker thread (mapdb, jinx installer), never in
# a cancellable path. Cena's supervisor races `connect()` against the cancel
# token in a `select!` (`cena-session/src/supervisor.rs:240-246`), so a blocking
# call inside that future makes the whole connect uncancellable -- exactly what
# this file's own header says tokio was chosen to prevent. ureq 3 DOES support
# native-tls; TLS was never the objection.
#
# WHY 0.12 AND NOT 0.13, the current release: `tauri-plugin-http` v2 pins
# reqwest 0.12, and mixing majors compiles two clients and two hyper stacks.
# `plan/11` keeps Tauri on the table, so pinning 0.12 keeps that door open at no
# cost -- web-login needs nothing 0.13 added (form POSTs, a cookie jar, and
# no-follow redirects are long stable). Revisit when the plugin moves, or drop
# to a single line change if Tauri is ruled out.
#
# The three features, each required by the protocol rather than convenient:
#   cookies -- the ASP session cookie from the sign-in GET, without which the
#              login POST returns a bare 500 (plan/10 section 5.4).
#   gzip    -- play.net serves compressed HTML, and the character list is
#              scraped from the body.
#   native-tls -- one stack, per above. www.play.net is TLS 1.3 with a valid
#              chain (VERIFIED by openssl 2026-09-19), so unlike the eaccess
#              socket NONE of live.rs's three weakenings apply here.
reqwest = { version = "0.12", default-features = false, features = [
    "native-tls",
    "cookies",
    "gzip",
] }

# The WebSocket shim game transport (`src/shim.rs`), the automatic fallback
# when the game port is unreachable (Lich PR #1664). Already in the lock file
# at this version through `cena-web`'s axum, so it adds an edge and no second
# copy. `handshake` only: TLS is this crate's own native-tls connector, so the
# crate's TLS features stay off and cannot pull in a second stack.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "test-util", "time"] }
# The keepalive test reads the options back off a loopback socket. `all` for
# the getters (`tcp_keepalive_time`, `tcp_user_timeout`), which is what lets
# it check the VALUES rather than only the on/off bit.
socket2 = { version = "0.6", features = ["all"] }

[lints]
workspace = true

# Android has no system libssl, so statically link a vendored OpenSSL there.
# Target-scoped, so Windows keeps SChannel and macOS keeps Security.framework
# and neither pays for a vendored build. Ported from VellumFE
# (`Cargo.toml:155-156`), which ships on all five platforms; its note records
# that the vendored-build pain "was Windows-only" and that Perl is "universal on
# Linux and present on CI runners".
#
# This is what `.github/workflows/ci.yml:52-56` was missing when it disabled the
# Android check over "Could not find directory of OpenSSL installation".
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
native-tls = { version = "0.2", features = ["vendored"] }
