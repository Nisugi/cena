[package]
name = "cena-behavior"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# The walker's vocabulary and its pathfinder (`plan/24` section 4). Pure, and
# depends on nothing, so the edge points downward.
cena-map.workspace = true
cena-session.workspace = true
# The hunt profile (`hunt/profile.rs`) is a serde struct read from and
# written to TOML; the bigshot importer writes one.
serde.workspace = true
toml.workspace = true
# `;foreach`'s filters and `waitre` are the player's patterns: `*` wildcards
# and `/regex/`, as foreach.lic takes them (`batch/foreach.rs`). The same
# crate `cena-model` already builds, so nothing new is compiled.
regex = "1"
tokio = { version = "1", features = ["macros", "rt", "time"] }
# CancellationToken: plan/12 section 4.3's PREEMPT_GRACE is measured against
# it, and section 5.5 names it as the mechanism for "every behavior is
# cancellable".
tokio-util = "0.7"

[dev-dependencies]
cena-platform.workspace = true
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "test-util", "time"] }

[lints]
workspace = true
