[package]
name = "cena-gui"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
cena-session.workspace = true
cena-ui.workspace = true
egui.workspace = true
eframe.workspace = true
# A play window's layout is saved by character name (plan/47 step 6): a
# store Hydra writes, so JSON, as the workspace's other stores are.
serde.workspace = true
serde_json.workspace = true
# Keybinds (plan/47 step 7): written by hand, so TOML, as the hunt profiles
# and the triggers are; each key named by winit's code for it, the version
# eframe already builds (no feature of its own, so nothing new is built).
toml.workspace = true
# A bar's overlay, an image the player puts in the data folder: the version
# and the one format eframe already builds, so nothing new is built.
image = { version = "0.25", default-features = false, features = ["png"] }
winit = { version = "0.30", default-features = false }
# Each character's feed runs on the binary's runtime, beside its session
# (plan/47 §4): the window has the main thread, the sessions the workers.
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-util = "0.7"

[dev-dependencies]
# `wgpu` renders a frame in a test and `snapshot` compares it with the image
# committed under `tests/snapshots/` (plan/47 §4: the GUI is checked through
# tests, never by running the binary).
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
# `test-util` for `start_paused`: a feed's retries and ticks run in virtual
# time.
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "test-util", "time"] }
# To hear egui's own debug warning that a widget changed its id in place,
# which a debug build draws as a red box (`tests/hub.rs`).
log = { version = "0.4", features = ["std"] }

[lints]
workspace = true
