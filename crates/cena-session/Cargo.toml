[package]
name = "cena-session"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# `derive`, for the travel file (`travel_store.rs`): the one type this crate
# persists that is its own rather than `cena-model`'s.
serde.workspace = true
serde_json.workspace = true
cena-model.workspace = true
# The session drives the parser directly. `Parser` is stateful and explicitly
# one per session (crates/cena-protocol/src/parser.rs:113-120: "One per
# session: it holds the stream stack and markup state for THAT character's
# connection"), and the actor matches on `Frame` to build state. Re-exporting
# Parser and all 51 Frame variants through cena-model would be a pass-through
# facade with one caller, which plan/05 Rule -1 forbids. This is a downward
# edge: cena-model -> cena-protocol already exists, so session -> protocol is
# the same direction, one layer further. Recorded in ALLOWED_EDGES.
cena-protocol.workspace = true
# The transport the session owns. plan/12 §7.1 puts "Session actor: lifecycle
# §5, queue §4" in M1's In column. The actor owns one connection; the
# supervisor module owns what outlives one. That module is the connection
# manager this comment used to say did not exist -- reconnect is built and
# live-verified.
cena-platform.workspace = true

rusqlite.workspace = true

tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
# CancellationToken. plan/12 §5.5 names it by name as the mechanism for "every
# behavior is cancellable", and §4.3's PREEMPT_GRACE is measured against it.
tokio-util = "0.7"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "test-util", "time"] }

[lints]
workspace = true
