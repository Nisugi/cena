name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Both, deliberately. Development is on Windows (CLAUDE.md) and the corpus
    # is a Windows path; CI was Linux-only, so neither platform saw the other's
    # breakage. Three concrete things this covers that a Linux-only job cannot:
    # harness::relative() exists ONLY to normalise `\` to `/` and was never
    # exercised in CI; CRLF (core.autocrlf is true on the dev machine and there
    # is no .gitattributes yet); and case-insensitive path behaviour in the
    # source walk. The architecture tests are where all three live, which is
    # why the test step runs on both.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # No version here on purpose. rust-toolchain.toml pins the channel and
      # rustup's file override wins over an action-installed default, so
      # pinning in both places creates two sources of truth that can drift.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # plan/06 section 4 lists these as 1. test, 2. clippy, 3. fmt. Reordered
      # cheapest-first so a formatting slip does not wait on a full build; the
      # set of required checks is unchanged.
      # fmt and clippy are platform-independent: one run is enough, and
      # doubling them buys nothing. The tests are not -- see the matrix
      # comment above.
      - run: cargo fmt --check
        if: matrix.os == 'ubuntu-latest'
      - run: cargo clippy --workspace --all-targets -- -D warnings
        if: matrix.os == 'ubuntu-latest'
      # Intra-doc links are citations, and a citation that resolves to nothing
      # does not fail loudly -- it manufactures a false negative (`CLAUDE.md`,
      # the `styleIfClosed` incident). `[workspace.lints.rustdoc]` makes the
      # three link lints DENY, so this run turns a broken link into a red build
      # rather than a warning nobody reads. Review finding PL-11.
      # One OS is enough: a link either resolves or does not, and it is the
      # same answer on every platform.
      - run: cargo doc --workspace --no-deps
        if: matrix.os == 'ubuntu-latest'

      # Architecture tests are part of this. plan/06 section 4 item 5 calls
      # them out separately only because they gate merges.
      - run: cargo test --workspace

  # plan/12 section 1a binds platform through behavior on both mobile targets.
  # Build libraries, including TLS and SQLite's native code; no device or game
  # login is required. Frontend crates are outside that binding set.
  # Vellum's android-check.yml / ios-check.yml supply the toolchain pattern.
  # Local evidence and remaining verification: plan/m4-mobile-verification.md.
  android-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Add to the toolchain selected by rust-toolchain.toml, not merely to
      # the action's installed stable default (which can be a newer version).
      - run: rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build Android core
        shell: bash
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:?Runner Android NDK is required}"
          test -d "$ANDROID_NDK_HOME/toolchains/llvm"
          command -v perl
          cargo ndk -t arm64-v8a build --locked --lib \
            -p cena-platform -p cena-protocol -p cena-model \
            -p cena-session -p cena-behavior

  ios-core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - name: Build iOS core
        run: |
          xcrun --sdk iphoneos --show-sdk-path
          cargo build --locked --lib --target aarch64-apple-ios \
            -p cena-platform -p cena-protocol -p cena-model \
            -p cena-session -p cena-behavior

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned browser test tools
        working-directory: crates/cena-web/browser-tests
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Despana rendering and same-tab pairing regression
        run: node crates/cena-web/browser-tests/smoke.mjs
      - name: Explorer snapshot and pure presentation regressions
        run: |
          python3 -m unittest discover -s tools/atlas -p 'test_*.py'
          node --test crates/cena-web/assets/atlas/tests/*.mjs
      - name: Native explorer browser regression (no game session)
        run: |
          cargo build --locked -p cena-web --example atlas_preview
          node crates/cena-web/browser-tests/atlas.mjs
          node crates/cena-web/browser-tests/minimap.mjs
