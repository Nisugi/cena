[package]
name = "cena-model"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
cena-protocol.workspace = true

# The crit-table matcher (plan/13 section 4a). plan/05:180 names the
# multi-pattern matcher as complexity paid for by a named requirement:
# ~2,395 crit patterns x every line x 25 sessions. `regex` is the linear-time
# engine that makes that affordable; see crit/match_index.rs for the measured
# comparison against RegexSet, and for why `fancy-regex` is NOT taken on for
# the single lookahead pattern.
regex = "1"
# The trigger matcher's literals (`plan/45` section 4, `src/trigger/matcher.rs`):
# one automaton for the literals where case matters and one for the rest,
# searched once a line. Already compiled for `regex`, which depends on it, so
# nothing new is built; the version is the one Cargo.lock already holds.
aho-corasick = "1.1"

[lints]
workspace = true
